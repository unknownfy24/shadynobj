<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shady = No Blowjob</title>
  <meta name="description" content="Shady = No Blowjob fantasy football league" />
  <style>
    :root {
      --bg: #0a0a0a;
      --fg: #f5f5f5;
      --accent: #d4af37;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      background-image: radial-gradient(circle at 50% 30%, #1a1a1a 0%, #0a0a0a 70%);
    }
    .wrap { max-width: 900px; }
    h1 {
      font-size: clamp(2.5rem, 8vw, 6rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.02em;
    }
    h1 .accent { color: var(--accent); }
    p.sub {
      margin-top: 1.5rem;
      font-size: clamp(1rem, 2.5vw, 1.5rem);
      color: #9a9a9a;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Shady <span class="accent">=</span> No Blowjob</h1>
    <p class="sub">Fantasy Football League</p>
  </div>
</body>
</html>
